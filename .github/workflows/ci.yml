name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test uses `node --test` globs and --experimental-strip-types,
          # which need Node 22.6 or newer.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Production build (vite + nitro). Catches bundling errors that
      # typecheck and lint miss. No DATABASE_URL is set here, so the
      # db:migrate step at the end of `npm run build` skips by design.
      - run: npm run build
        env:
          DATABASE_URL: ""
